name: Deploy a Vercel (produccion)

# OPCIONAL / ALTERNATIVA. Si conectas el repo en Vercel (Project -> Settings -> Git)
# NO necesitas este workflow: cada push a main ya redeploya solo. Ver el skill
# "configurar-deploy" (Parte B). Usa este archivo solo si preferis un CI propio con
# control del build en lugar de la conexion nativa.
#
# Secretos a cargar en GitHub (Settings -> Secrets and variables -> Actions), con los
# datos de TU propia cuenta Vercel:
#     VERCEL_TOKEN        (vcp_...)   token de tu cuenta Vercel
#     VERCEL_ORG_ID       (team_... o tu user id)
#     VERCEL_PROJECT_ID   (prj_... de tu proyecto)
# Obtenelos con `npx vercel link` en el repo, o desde el dashboard de Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull config de Vercel (produccion)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (prebuilt)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
